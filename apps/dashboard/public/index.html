<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Marketing progress</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./app.mjs"></script>
  </head>
  <body>
    <a class="skip-link" href="#overview">Skip to overview</a>
    <div class="shell">
      <header class="topbar">
        <label class="business-picker"
          ><span>Marketing /</span
          ><select id="business" aria-label="Choose a project">
            <option value="">Loading…</option>
          </select></label
        >
        <button
          id="refresh"
          class="quiet-button"
          type="button"
          title="Reread saved observations"
        >
          Refresh ↻
        </button>
      </header>
      <main id="overview">
        <p id="message" class="notice" role="status" hidden></p>
        <div id="loading" class="loading" role="status" hidden>Loading…</div>
        <div id="content" hidden>
          <div class="page-heading">
            <div>
              <h1 id="business-name"></h1>
              <p class="goal-line">Goal <span id="goal"></span></p>
            </div>
            <span id="observed-at" class="muted"></span>
          </div>
          <section aria-label="Goal and supporting metrics">
            <div id="metrics" class="metrics-grid"></div>
          </section>
          <div class="progress-grid">
            <section class="panel trend-panel" aria-labelledby="progress-title">
              <div class="section-heading">
                <h2 id="progress-title">Progress over time</h2>
                <select id="trend-metric" aria-label="Metric to plot"></select>
              </div>
              <div id="trend"></div>
            </section>
            <section class="panel next-panel" aria-labelledby="next-title">
              <div class="section-heading">
                <p class="eyebrow">Next move</p>
                <span id="next-status" class="status-label"></span>
              </div>
              <h2 id="next-title"></h2>
              <p id="next-reason"></p>
              <div id="next-source"></div>
              <p id="next-review" class="review-note" hidden></p>
              <details id="attention-details">
                <summary id="attention-title">Dependencies</summary>
                <ul id="attention"></ul>
              </details>
            </section>
          </div>
          <section
            class="panel learning-panel"
            aria-labelledby="learning-title"
          >
            <div class="section-heading">
              <h2 id="learning-title">What we learned → what changes</h2>
              <div id="learning-source"></div>
            </div>
            <div id="lessons"></div>
          </section>
          <details class="records-disclosure">
            <summary>
              Work &amp; source records <span id="work-count"></span>
            </summary>
            <div id="work" class="record-list"></div>
          </details>
          <div id="warnings" class="warnings"></div>
        </div>
      </main>
    </div>
    <dialog id="record-dialog" aria-labelledby="record-title">
      <div class="dialog-header">
        <h2 id="record-title">Record</h2>
        <button id="close-record" class="quiet-button" type="button">
          Close ×
        </button>
      </div>
      <p id="record-meta" class="record-meta"></p>
      <div id="record-content" class="record-content" tabindex="0"></div>
    </dialog>
  </body>
</html>
